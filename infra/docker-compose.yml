services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: doc-canvas-postgres
    environment:
      POSTGRES_DB: doc_canvas
      POSTGRES_USER: doc_canvas
      POSTGRES_PASSWORD: doc_canvas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_canvas -d doc_canvas"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: doc-canvas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: doc-canvas-rustfs
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
