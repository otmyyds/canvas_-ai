server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: doc-canvas
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:doc_canvas}
    username: ${POSTGRES_USER:doc_canvas}
    password: ${POSTGRES_PASSWORD:doc_canvas}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 批量写：布局一次会更新大量节点坐标，按 100 条合并 JDBC 往返
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0
  ai:
    # 关闭 Spring AI 内置重试（默认 10 次、2s 起、5 倍退避）：
    # 重试只保留 LlmGateway 一层，否则真实请求数成倍放大且不计入任务预算
    retry:
      max-attempts: 1
    openai:
      # 密钥：优先百炼 BAILIAN_API_TOKEN，其次 GPT_API_KEY
      api-key: ${BAILIAN_API_TOKEN:${GPT_API_KEY:${OPENAI_API_KEY:sk-placeholder}}}
      # Spring AI 会拼接 /v1/chat/completions，base-url 不要带 /v1
      base-url: ${GPT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_MODEL_PLANNER:qwen-plus}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}
    # 独立 embedding 配置（走百炼 / OpenAI 兼容 / 阿里 DashScope）
    embedding:
      api-key: ${BAILIAN_API_TOKEN:${GPT_API_KEY:${OPENAI_API_KEY:}}}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${EMBEDDING_MODEL:text-embedding-v3}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - http://192.168.*:*
      - http://10.*:*
      - http://172.16.*:*
      - http://172.17.*:*
      - http://172.18.*:*
      - http://172.19.*:*
      - http://172.20.*:*
      - http://172.21.*:*
      - http://172.22.*:*
      - http://172.23.*:*
      - http://172.24.*:*
      - http://172.25.*:*
      - http://172.26.*:*
      - http://172.27.*:*
      - http://172.28.*:*
      - http://172.29.*:*
      - http://172.30.*:*
      - http://172.31.*:*
  ai:
    llm:
      # 默认模型与降级模型；具体模型名通过请求级 OpenAiChatOptions 传入
      default-model: ${AI_MODEL_PLANNER:qwen-plus}
      fallback-model: ${AI_MODEL_FALLBACK:qwen-max}
      operations:
        # 预检也走 qwen-plus
        preflight: ${AI_MODEL_PREFLIGHT:qwen-plus}
        agent: ${AI_MODEL_AGENT:qwen-plus}
        tool: ${AI_MODEL_TOOL:qwen-plus}
      retry:
        # 只重试上游瞬时错误，解析/校验错误由 Agent 自己纠正
        max-attempts: ${AI_LLM_RETRY_MAX_ATTEMPTS:3}
        initial-backoff-ms: ${AI_LLM_RETRY_INITIAL_BACKOFF_MS:500}
        multiplier: ${AI_LLM_RETRY_MULTIPLIER:2.0}
        max-backoff-ms: ${AI_LLM_RETRY_MAX_BACKOFF_MS:4000}
    image:
      # 百炼文生图（DashScope 原生接口，非 OpenAI 兼容）
      api-key: ${BAILIAN_API_TOKEN:${GPT_API_KEY:${OPENAI_API_KEY:}}}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      model: ${AI_IMAGE_MODEL:wanx2.1-t2i-plus}
    # 联网搜索（SerpAPI，用于版本/日期等时效性问题）
    web-search:
      api-key: ${SERPAPI_API_KEY:}
      base-url: ${SERPAPI_BASE_URL:https://serpapi.com}
    task:
      per-user-concurrency: ${AI_TASK_PER_USER_CONCURRENCY:2}
      per-board-write-concurrency: ${AI_TASK_PER_BOARD_WRITE_CONCURRENCY:1}
      # 多用户并发：每个实例启动的消费者循环数；任务仍受每用户/每画布并发限制
      consumer-concurrency: ${AI_TASK_CONSUMER_CONCURRENCY:4}
    agent:
      # 单次运行上限
      max-steps: ${AI_AGENT_MAX_STEPS:20}
      # 一次计划包含多步骤、分支并行与语义审查；每个 HTTP 尝试都计数，默认值需覆盖两轮分支重试
      max-model-calls: ${AI_AGENT_MAX_MODEL_CALLS:24}
      # 生成阶段只用只读工具（画布摘要、资料检索、联网搜索），上限覆盖多轮资料检索
      max-tool-calls: ${AI_AGENT_MAX_TOOL_CALLS:40}
      max-total-tokens: ${AI_AGENT_MAX_TOTAL_TOKENS:80000}
      max-duration-seconds: ${AI_AGENT_MAX_DURATION_SECONDS:600}
      # 委派
      max-branches: ${AI_AGENT_MAX_BRANCHES:8}
      branch-parallelism: ${AI_AGENT_BRANCH_PARALLELISM:4}
      # 每用户同时展开的分支数：小于全局池，避免一个用户的大图占满 Worker
      branch-per-user-parallelism: ${AI_AGENT_BRANCH_PER_USER_PARALLELISM:2}
      branch-max-model-calls: ${AI_AGENT_BRANCH_MAX_MODEL_CALLS:4}
      branch-max-tool-calls: ${AI_AGENT_BRANCH_MAX_TOOL_CALLS:8}
      branch-max-tokens: ${AI_AGENT_BRANCH_MAX_TOKENS:20000}
      branch-max-children: ${AI_AGENT_BRANCH_MAX_CHILDREN:5}
      branch-max-duration-seconds: ${AI_AGENT_BRANCH_MAX_DURATION_SECONDS:90}
      # 树型大图委派：Supervisor 拆分分支，BranchWorker 并行展开
      delegation-enabled: ${AI_AGENT_DELEGATION_ENABLED:true}
      # false：任一分支失败即整体失败；true：跳过失败分支，保留成功结果
      delegate-allow-partial: ${AI_AGENT_DELEGATE_ALLOW_PARTIAL:false}
      # 预检
      preflight-max-model-calls: ${AI_AGENT_PREFLIGHT_MAX_MODEL_CALLS:4}
      preflight-max-tool-calls: ${AI_AGENT_PREFLIGHT_MAX_TOOL_CALLS:6}
      preflight-max-duration-seconds: ${AI_AGENT_PREFLIGHT_MAX_DURATION_SECONDS:20}
      # 会话
      session-window-messages: ${AI_AGENT_SESSION_WINDOW_MESSAGES:20}
      session-summary-threshold: ${AI_AGENT_SESSION_SUMMARY_THRESHOLD:30}
      # 审查
      critic-enabled: ${AI_AGENT_CRITIC_ENABLED:true}
      critic-min-nodes: ${AI_AGENT_CRITIC_MIN_NODES:30}
      critic-max-rounds: ${AI_AGENT_CRITIC_MAX_ROUNDS:1}
      # 规模上限
      max-nodes-per-task: ${AI_AGENT_MAX_NODES_PER_TASK:80}
    # 布局：画布节点总数超过上限后只允许逻辑图，树形图（径向）按钮禁用
    layout:
      radial-max-nodes: ${AI_LAYOUT_RADIAL_MAX_NODES:40}
    quota:
      daily-tokens-per-user: ${AI_QUOTA_DAILY_TOKENS_PER_USER:200000}
      daily-tasks-per-user: ${AI_QUOTA_DAILY_TASKS_PER_USER:30}
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
    bucket: ${RUSTFS_BUCKET:doc-canvas}
    region: ${RUSTFS_REGION:us-east-1}
  # 向量 embedding 提供方（阿里百炼 text-embedding-v3，输出 1024 维）
  embedding:
    api-key: ${BAILIAN_API_TOKEN:}
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${EMBEDDING_MODEL:text-embedding-v3}

logging:
  level:
    root: INFO
    # 业务代码默认 INFO，调试时可临时改为 DEBUG 打开更细的日志
    com.picturecreate.doccanvas: ${LOG_LEVEL:INFO}
    # 压低框架噪音，让业务日志更显眼
    org.springframework: WARN
    org.hibernate: WARN
